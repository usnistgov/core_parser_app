<div class="mod_checkboxes">
	{% if label %}
	<label>{{ label }}</label>
	{% endif %}
	<div class="row">
		{% for col in columns %}
			<div class="col">
				{% for item in col %}
					<span><input type="checkbox" {% if item.checked %}checked{% endif %} value="{{ item.key }}"/>{{ item.val }}</span>
				{% endfor %}
			</div>
		{% endfor %}
    </div>
</div>
