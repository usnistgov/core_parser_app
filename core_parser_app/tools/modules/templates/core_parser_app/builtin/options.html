<div class="mod_options">
	{% if label %}
	<label>{{label}}</label>
	{% endif %}
    
	{% if disabled %}
	<select disabled>
	{%else%}
	<select>
	{% endif %}
	{% for opt in options%}
	<option value="{{ opt.key }}" {% if opt.selected%}selected{% endif %}>{{ opt.val }}</option>
	{% endfor %}
	</select>
</div>
